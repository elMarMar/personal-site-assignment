<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvin's Personal Site</title>
    <link rel="stylesheet" href="./styles.css">
    <link href='https://fonts.googleapis.com/css2?family=Lobster&display=swap' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <img src="">
        <ul class="nav-links">
            <li>
                <a href="">
                    <span>Home</span>
                </a>
            </li>
            <li>
                <a href="./about-me.html">
                    <span>About Me</span>
                </a>
            </li>
        </ul>
    </nav>
    <section class="hero">
        <div class="name-container">
            <img src="./assets/blue-blob.png" alt="Blue Blob" id="blue-blob"/>
            <h1>
                <span class="name" id="first-name">Marvin</span> 
                <span class="name" id="first-name">Recio</span>
            </h1>
            <ul class="social-link-container">
                <li class="social-link">
                    <a href="https://www.instagram.com/the_barbin_machine/">
                        <img class="social-icon" src="./assets/instagram-simple.png">
                    </a>
                    
                </li>
                <li>
                    <a href="linkedin.com/in/marvin-joseph-recio/?skipRedirect=true">
                        <img class="social-icon" src="./assets/linkedIn-simple.png">
                    </a>
                </li>
                <li>
                    <a href="http://github.com/elMarMar">
                         <img class="social-icon" src="./assets/github-simple.png">
                    </a>
                   
                </li>
            </ul>
        </div>
        <div class="portrait-container">
            <img src="./assets/marvin.jpg" class="portrait" alt="Portrait of Marvin">
            <img src="./assets/orange-fruit.png" alt="orange-fruit" class="portrait-decoration" id="orange-fruit">
            <img src="./assets/autumn-leaf.png" alt="autumn leaf" class="portrait-decoration" id="leaf1">
            <img src="./assets/autumn-leaf.png" alt="autumn leaf" class="portrait-decoration" id="leaf2">
        </div>
    </section>
    <section class="form-section">

        <div>
            <div id="secret-container">
                <p>Psssstttt... I have something to tell you:</p>
                <form>
                    <input type="text" placeholder="Tell me your name" id="name-input">
                    <button type="submit" id="name-submit-btn">Submit</button>
                </form>
            </div>
            <div id="secret-message" class="hidden">
                <p></p>
            </div>
        </div>

    </section>
    <footer>
        <span>Assets Used:</span>
        <a href="https://www.vecteezy.com/free-vector/autumn">Autumn Vectors by Vecteezy</a>
        <a href="https://www.vecteezy.com/free-vector/orange">Orange Vectors by Vecteezy</a>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
